# CI for voice-agent-platform.
# Activates by moving this file to .github/workflows/ci.yml
# (the GitHub App used to push this repo lacks the Workflows permission,
# so the workflow definition ships here instead of .github/workflows/).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
